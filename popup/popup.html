<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0f1419;
      --muted: #536471;
      --border: #cfd9de;
      --hover: #f7f9f9;
      --primary: #0f1419;
      --primary-fg: #ffffff;
      --primary-hover: #272c30;
      --ok: #00ba7c;
      --error: #f4212e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15202b;
        --fg: #e7e9ea;
        --muted: #8b98a5;
        --border: #38444d;
        --hover: #1e2732;
        --primary: #eff3f4;
        --primary-fg: #0f1419;
        --primary-hover: #d7dbdc;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 248px;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
    }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 700; font-size: 15px; }
    header img { width: 20px; height: 20px; }
    button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 38px;
      margin-bottom: 8px;
      border-radius: 9999px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .15s;
    }
    button svg { width: 16px; height: 16px; flex: none; }
    #copy { border: none; background: var(--primary); color: var(--primary-fg); }
    #copy:hover { background: var(--primary-hover); }
    #download { border: 1px solid var(--border); background: transparent; color: var(--fg); }
    #download:hover { background: var(--hover); }
    button:disabled { opacity: .5; cursor: default; }
    #status { min-height: 1.4em; margin: 4px 0 0; font-size: 12px; color: var(--muted); text-align: center; word-break: break-all; }
    #status[data-state="ok"] { color: var(--ok); }
    #status[data-state="error"] { color: var(--error); }
  </style>
</head>
<body>
  <header><img src="../icons/icon32.png" alt="">X Markdown</header>
  <button id="copy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    复制 Markdown
  </button>
  <button id="download">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    下载 .md
  </button>
  <p id="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
